[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebar-optimizer"
dynamic = ["version"]
description = "Rebar cutting stock optimizer (1D cutting stock, multiple stock lengths)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl==3.1.5",
    "ortools==9.15.6755",
    "PySide6-Essentials==6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "hypothesis==6.169.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pyinstaller==6.22.3",
]

[project.scripts]
rebar-optimizer = "rebar_optimizer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rebar_optimizer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rebar_optimizer = ["ui/resources/*.svg"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gui: tests that need Qt (run offscreen)",
    "slow: longer-running solver tests",
]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
    "RUF001",   # ambiguous unicode chars (Thai text)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["rebar_optimizer"]
exclude = ["^legacy/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "rebar_optimizer",
    "rebar_optimizer.domain.*",
    "rebar_optimizer.solver.*",
    "rebar_optimizer.services.*",
    "rebar_optimizer.io.*",
    "rebar_optimizer.i18n.*",
    "rebar_optimizer.cli",
    "rebar_optimizer.logging_config",
]
strict = true

[[tool.mypy.overrides]]
module = ["ortools.*", "openpyxl.*"]
ignore_missing_imports = true
